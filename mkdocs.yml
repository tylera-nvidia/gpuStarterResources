site_name: GPU Engineering Starter Resources
site_description: A compact technical hub for CUDA engineers.
site_url: https://tylera-nvidia.github.io/gpuStarterResources/
repo_url: https://github.com/tylera-nvidia/gpuStarterResources
repo_name: tylera-nvidia/gpuStarterResources
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - CUDA Performance Guide: cuda-performance-guide.md
  - Guides:
      - Real-Time GPU Optimization: guides/RealTimeTips.md
      - GPU System Diagnostics: guides/system-diagnostics.md

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: true
